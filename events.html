<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Events | Leshky Records</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080808;color:#fff}
a{text-decoration:none;color:inherit}
nav{padding:18px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #292929}
.logo{font-weight:900;font-size:22px;letter-spacing:2px}.logo span,h1 span{color:#d4af37}.logo small{display:block;font-size:8px;letter-spacing:4px;color:#888;text-align:center}
.links{display:flex;gap:22px}.links a{color:#ccc;font-size:14px}
.hero{padding:80px 7%;background:#120808}.hero p{color:#999;margin-top:10px}
section{padding:60px 7%;max-width:1100px;margin:auto}
.event{display:flex;gap:25px;background:#151515;border:1px solid #292929;padding:25px;margin-bottom:20px}
.date{min-width:100px;text-align:center;border-right:1px solid #333;padding-right:20px}
.date strong{display:block;font-size:28px;color:#d4af37}.date span{font-size:12px;color:#888}
.event h2{margin-bottom:8px}.event p{color:#999}
footer{padding:35px 7%;border-top:1px solid #222;color:#777}
@media(max-width:700px){.links{display:none}.event{display:block}.date{text-align:left;border-right:0;border-bottom:1px solid #333;padding:0 0 15px;margin-bottom:15px}}
</style>
</head>
<body>

<nav>
<a href="index.html" class="logo">LESHKY <span>RECORDS</span><small>SOUND TO LEGACY</small></a>
<div class="links">
<a href="index.html">Home</a><a href="music.html">Music</a><a href="artists.html">Artists</a>
<a href="about.html">About</a><a href="news.html">News</a><a href="events.html">Events</a>
<a href="media.html">Media</a><a href="contact.html">Contact</a>
</div>
</nav>

<header class="hero">
<h1>Upcoming <span>Events</span></h1>
<p>Concerts, showcases, listening parties and Leshky Records events.</p>
</header>

<section>

<div class="event">
<div class="date"><strong>--</strong><span>DATE</span></div>
<div><h2>Events Coming Soon</h2><p>Stay tuned for Leshky Records events and artist performances.</p></div>
</div>

</section>

<footer>© 2026 Leshky Records • Sound to Legacy</footer>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dcjeqalpzuewlholdbqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_LZkkwMKMxbEMi3hKY-op4g_gHSQO529";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadEvents() {

  const { data: events, error } = await client
    .from("events")
    .select("*")
    .order("event_date", { ascending: true });

  if (error) {
    console.error("Error loading events:", error);
    return;
  }

  const container =
    document.getElementById("supabaseEvents");

  if (!container) return;

  container.innerHTML = "";

  events.forEach(event => {

    const card =
      document.createElement("article");

    card.style.cssText = `
      background:#111;
      border:1px solid #333;
      padding:20px;
      border-radius:12px;
    `;

    card.innerHTML = `

      ${
        event.image_url
          ? `
            <img
              src="${event.image_url}"
              alt="${event.title}"
              style="
                width:100%;
                aspect-ratio:16/9;
                object-fit:cover;
                border-radius:10px;
                margin-bottom:15px;
              "
            >
          `
          : ""
      }

      <h3>${event.title}</h3>

      <p>
        ${event.description || ""}
      </p>

      <p>
        📍 ${event.location || "Location TBA"}
      </p>

      <p>
        📅 ${
          event.event_date
            ? new Date(event.event_date)
                .toLocaleString()
            : ""
        }
      </p>

      ${
        event.ticket_url
          ? `
            <a
              href="${event.ticket_url}"
              target="_blank"
              style="
                color:#d4af37;
                display:inline-block;
                margin-top:10px;
              "
            >
              Tickets / More Info
            </a>
          `
          : ""
      }

    `;

    container.appendChild(card);

  });
}

loadEvents();
</script>
