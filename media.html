<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Media | Leshky Records</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080808;color:#fff}
a{text-decoration:none;color:inherit}
nav{padding:18px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #292929}
.logo{font-weight:900;font-size:22px;letter-spacing:2px}.logo span,h1 span{color:#d4af37}.logo small{display:block;font-size:8px;letter-spacing:4px;color:#888;text-align:center}
.links{display:flex;gap:22px}.links a{color:#ccc;font-size:14px}
.hero{padding:80px 7%;background:#120808}.hero p{color:#999;margin-top:10px}
section{padding:60px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.item{height:230px;background:linear-gradient(135deg,#8f1018,#d4af37);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
footer{padding:35px 7%;border-top:1px solid #222;color:#777}
@media(max-width:700px){.links{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
<a href="index.html" class="logo">LESHKY <span>RECORDS</span><small>SOUND TO LEGACY</small></a>
<div class="links">
<a href="index.html">Home</a><a href="music.html">Music</a><a href="artists.html">Artists</a>
<a href="about.html">About</a><a href="news.html">News</a><a href="events.html">Events</a>
<a href="media.html">Media</a><a href="contact.html">Contact</a>
</div>
</nav>

<header class="hero">
<h1>Our <span>Media</span></h1>
<p>Photos, videos and moments from the Leshky Records journey.</p>
</header>

<section>
<div class="grid">
<div class="item">PHOTO GALLERY</div>
<div class="item">MUSIC VIDEOS</div>
<div class="item">ARTISTS</div>
<div class="item">BEHIND THE SCENES</div>
<div class="item">EVENTS</div>
<div class="item">LESHKY RECORDS</div>
</div>
</section>

<section style="padding:60px 20px;">

  <h2 style="text-align:center;">
    Leshky <span style="color:#d4af37;">Media</span>
  </h2>

  <div
    id="supabaseMedia"
    style="
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
      max-width:1100px;
      margin:30px auto;
    ">
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dcjeqalpzuewlholdbqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_LZkkwMKMxbEMi3hKY-op4g_gHSQO529";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadMedia() {

  const { data: media, error } = await client
    .from("media")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Error loading media:", error);
    return;
  }

  const container =
    document.getElementById("supabaseMedia");

  if (!container) return;

  container.innerHTML = "";

  media.forEach(item => {

    const card =
      document.createElement("article");

    card.style.cssText = `
      background:#111;
      border:1px solid #333;
      padding:20px;
      border-radius:12px;
    `;

    let mediaContent = "";

    if (item.type === "image") {

      mediaContent = `
        <img
          src="${item.file_url}"
          alt="${item.title}"
          style="
            width:100%;
            aspect-ratio:16/9;
            object-fit:cover;
            border-radius:10px;
            margin-bottom:15px;
          "
        >
      `;

    } else if (item.type === "video") {

      mediaContent = `
        <video
          controls
          style="
            width:100%;
            border-radius:10px;
            margin-bottom:15px;
          "
        >
          <source
            src="${item.file_url}"
            type="video/mp4"
          >
          Your browser does not support video playback.
        </video>
      `;

    }

    card.innerHTML = `

      ${mediaContent}

      <h3>${item.title}</h3>

      <p style="opacity:.7;">
        ${item.type}
      </p>

      <p>
        ${item.description || ""}
      </p>

    `;

    container.appendChild(card);

  });
}

loadMedia();
</script>

<footer>© 2026 Leshky Records • Sound to Legacy</footer>
</body>
</html>
