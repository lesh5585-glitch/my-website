<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leshky Records — Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      color: #d4af37;
      letter-spacing: 3px;
      font-size: 28px;
    }

    .brand p {
      color: #aaa;
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 2px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      background: #1b1b1b;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #f0cf55;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #d4af37;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="brand">
      <h1>LESHKY RECORDS</h1>
      <p>SOUND TO LEGACY</p>
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" id="loginButton">
        LOGIN
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Leshky Records
    </a>

  </div>

  <script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "https://dcjeqalpzuewlholdbqc.supabase.co";

    const SUPABASE_KEY = "sb_publishable_LZkkwMKMxbEMi3hKY-op4g_gHSQO529";

    const { createClient } =
      supabase;

    const client =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // LOGIN
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginButton.disabled = true;

      loginButton.textContent = "LOGGING IN...";

      message.textContent = "";


      const { data, error } =
        await client.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        message.textContent =
          "Login failed: " + error.message;

        message.style.color = "#ff5555";

        loginButton.disabled = false;

        loginButton.textContent = "LOGIN";

        return;
      }


      message.textContent =
        "Login successful. Opening dashboard...";

      message.style.color = "#d4af37";


      // Temporary dashboard destination.
      // We will create this page next.

      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);

    });

  </script>

</body>
</html>
